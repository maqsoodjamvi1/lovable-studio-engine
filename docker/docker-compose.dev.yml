# Warm development container for a single user project.
# The Python orchestrator writes files into the host volume;
# Vite inside this container hot-reloads instantly (no Docker rebuild).
#
# Usage (after provisioning a project):
#   PROJECT_ID=your-uuid docker compose -f docker/docker-compose.dev.yml up -d

version: "3.8"

services:
  app-preview-runtime:
    container_name: project-preview-${PROJECT_ID:-sample}
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ${WORKSPACE_DIR:-/var/platform/workspaces}/${PROJECT_ID:-sample}:/app
      - ../shared:/app/shared:ro
    ports:
      - "5173:5173"
    environment:
      - VITE_DEV_SERVER_HOSTNAME=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  production-postgres:
    image: postgres:16-alpine
    container_name: production-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platformsecret}
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
